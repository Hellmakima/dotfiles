
# Prefix
set -g  prefix `
unbind C-b
bind ` send-prefix

# Reload config
bind q source-file ~/.tmux.conf

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Tc"
bind r command-prompt -I "rename window:" "rename-window -- '%%'"
bind g popup -d "#{pane_current_path}" -w 80% -h 80% "bash"
bind c new-window -c "#{pane_current_path}"
setw -g mode-keys vi
bind x kill-pane
bind -T copy-mode-vi v send -X begin-selection // PREFIX [ to enter copy mode, y or q to exit
bind -T copy-mode-vi y send -X copy-selection-and-cancel

set-option -g status-position top
# Cappuccin
run ~/.tmux/plugins/catppuccin/catppuccin.tmux

# tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/yank'

run '~/.tmux/plugins/tpm/tpm'

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
