[[mgr.prepend_keymap]]
on   = [ "g", "i" ]
run  = "plugin lazygit"
desc = "run lazygit"

[[mgr.prepend_keymap]]
on   = [ "g", "w" ]
run  = "cd /storage/emulated/0/Android/media/com.whatsapp/WhatsApp/Media/WhatsApp Documents"
desc = "go to whatsapp Media/Documents"

[[mgr.prepend_keymap]]
on   = [ "g", "d" ]
run  = "cd sftp://gd"
desc = "go to Google Drive (via rclone serve sftp)"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "a" ]
run  = "plugin compress"
desc = "archive"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "p" ]
run  = "plugin compress -p"
desc = "archive password"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "h" ]
run  = "plugin compress -ph"
desc = "archive (password + header encryption)"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "l" ]
run  = "plugin compress -l"
desc = "archive (compression level)"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "u" ]
run  = "plugin compress -phl"
desc = "archive (pass+hdr+level)"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "7" ]
run  = "plugin compress -phl 7z"
desc = "archive 7z (pass+hdr+lvl)"

