
# Prefix
set -g  prefix `
unbind C-b
bind ` send-prefix

# Reload config
bind q source-file ~/.tmux.conf

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Tc"
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
bind g popup -d "#{pane_current_path}" -w 80% -h 80% "bash"
bind c new-window -c "#{pane_current_path}"
bind n new-session -d -s job -c "#{pane_current_path}" \; switch-client -t job
setw -g mode-keys vi
bind x kill-pane
# vim-like copy-mode selection (defaults: v=rectangle-toggle, no y)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
set -g set-clipboard on

set-option -g status-position top

# tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/yank'

run '~/.tmux/plugins/tpm/tpm'

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Transparent status bar
set -g status-style "bg=terminal"
set -g status-left ""
set -g status-right "#[fg=white bold] %a %e %H:%M "
set -g status-right-length 40
set -g status-left-length 60

# Just the window numbers; current wrapped in [ ]
set -g window-status-format " #I "
set -g window-status-current-format " [#I] "
set -g window-status-separator ""
set -g window-status-style "bg=terminal"
set -g window-status-current-style "bg=terminal bold"
set -g window-status-activity-style "bg=terminal fg=black"

# `I to reload
